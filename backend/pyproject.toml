[project]
name = "commerce-agent-backend"
version = "0.1.0"
description = "FastAPI backend for the CommerceAgent e-commerce operations sandbox"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23,<26",
  "asyncpg>=0.31,<1",
  "fastapi>=0.121.0",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "pydantic>=2.0.0",
  "pyjwt>=2.10,<3",
  "python-dotenv>=1,<2",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=1,<2",
  "testcontainers>=4.15,<5",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
