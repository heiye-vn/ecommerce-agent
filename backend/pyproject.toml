[project]
name = "commerce-agent-backend"
version = "0.1.0"
description = "FastAPI backend for the CommerceAgent e-commerce operations sandbox"
requires-python = ">=3.11"
dependencies = [
  "aio-pika>=9.5,<10",
  "alembic>=1.16,<2",
  "argon2-cffi>=23,<26",
  "asyncpg>=0.31,<1",
  "fastapi>=0.121.0",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "pydantic>=2.0.0",
  "pyjwt>=2.10,<3",
  "python-dotenv>=1,<2",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "mypy>=1.15.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=1,<2",
  "ruff>=0.11.0",
  "testcontainers>=4.15,<5",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
